name: Build Echo Grid Android APK & Play Store AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v5

      - name: 2. Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 3. Set up Java JDK 21 (Required for Capacitor Android)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 4. Install Node Dependencies
        run: npm install

      - name: 5. Prepare www Assets & Sync Capacitor Android
        run: |
          mkdir -p www
          cp index.html style.css script.js manifest.json sw.js *.png www/
          npx cap sync android

      - name: 6. Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: 7. Sign & Compile Play Store Bundle (.aab) + Debug APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'EchoGrid2026!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'echogrid' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'EchoGrid2026!' }}
        run: |
          mkdir -p release-output
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/upload-keystore.jks" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Sanskar Joshi, OU=GameDev, O=SanskarJoshi, L=Ambaji, S=Gujarat, C=IN"
            cp "$RUNNER_TEMP/upload-keystore.jks" release-output/upload-keystore.jks
            base64 -w 0 "$RUNNER_TEMP/upload-keystore.jks" > release-output/KEYSTORE_BASE64.txt
          fi
          export KEYSTORE_FILE="$RUNNER_TEMP/upload-keystore.jks"
          cd android
          ./gradlew assembleDebug bundleRelease
          cp app/build/outputs/apk/debug/app-debug.apk ../release-output/Echo-Grid-Debug.apk
          cp app/build/outputs/bundle/release/app-release.aab ../release-output/Echo-Grid-PlayStore-Release.aab

      - name: 8. Upload Play Store Bundle (.aab) & APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Echo-Grid-PlayStore-Bundle
          path: release-output/
